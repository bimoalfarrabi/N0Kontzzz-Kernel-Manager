name: Build Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v6

    # 2️⃣ Setup JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3️⃣ Validate Gradle wrapper
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v3

    # 4️⃣ Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 33
        build-tools: 33.0.2

    # 5️⃣ Decode keystore from Secret
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-key.jks

    # 6️⃣ Build Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --info

    # 7️⃣ Sign APK
    - name: Sign APK
      run: |
        apksigner sign \
          --ks my-key.jks \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          --ks-key-alias ${{ secrets.KEY_ALIAS }} \
          app/build/outputs/apk/release/app-release-unsigned.apk

    # 8️⃣ Verify APK signature
    - name: Verify APK signature
      run: apksigner verify app/build/outputs/apk/release/app-release-unsigned.apk

    # 9️⃣ Rename APK النهائي
    - name: Rename APK
      run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Jo-Kernel-Manager-Release.apk

    # 🔟 Upload signed APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: Jo-Kernel-Manager-Release-APK
        path: app/build/outputs/apk/release/Jo-Kernel-Manager-Release.apk
        if-no-files-found: warn
        retention-days: 14
