name: Build Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Increase memory for Gradle and Kotlin compiler
      run: |
        echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
        echo "kotlin.daemon.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --info

    - name: Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: Jo-Kernel-Manager-Release-APK
        path: app/build/outputs/apk/release/*.apk  # غيرنا لـ *.apk عشان يلاقي أي APK في المجلد
        if-no-files-found: warn  # بدل error عشان ما يفشلش الـ job لو مش موجود
        retention-days: 14
