name: Build Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v6

    # 2️⃣ Setup JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3️⃣ Cache Gradle dependencies
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper/
        key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # 4️⃣ Cache build outputs
    - name: Cache build outputs
      uses: actions/cache@v3
      with:
        path: app/build
        key: build-${{ runner.os }}-app

    # 5️⃣ Validate Gradle wrapper
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v3

    # 6️⃣ Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x gradlew

    # 7️⃣ Set up Android SDK + Build Tools
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 36
        build-tools: 36.0.0

    # 8️⃣ Decode keystore from Secret
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-key.jks

    # 9️⃣ Build Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --info

    # 🔟 Sign APK (v1 + v2 + v3)
    - name: Sign APK
      run: |
        $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
          --ks my-key.jks \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          --ks-key-alias ${{ secrets.KEY_ALIAS }} \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          app/build/outputs/apk/release/app-release-unsigned.apk

    # 1️⃣1️⃣ Verify APK signature
    - name: Verify APK signature
      run: |
        $ANDROID_HOME/build-tools/36.0.0/apksigner verify \
          app/build/outputs/apk/release/app-release-unsigned.apk

    # 1️⃣2️⃣ Rename APK النهائي
    - name: Rename APK
      run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Jo-Kernel-Manager-Release.apk

    # 1️⃣3️⃣ Upload signed APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: Jo-Kernel-Manager-Release-APK
        path: app/build/outputs/apk/release/Jo-Kernel-Manager-Release.apk
        if-no-files-found: warn
        retention-days: 14
